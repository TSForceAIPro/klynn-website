<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="klynnBlueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#215AD8" />
      <stop offset="50%" stop-color="#1848B7" />
      <stop offset="100%" stop-color="#0F338D" />
    </linearGradient>
    <linearGradient id="klynnTealAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
  
  <!-- Background Banner -->
  <rect width="800" height="240" rx="16" fill="url(#klynnBlueBg)" />
  
  <!-- KLYNN Wordmark Group -->
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="124" letter-spacing="2">
    <!-- K -->
    <text x="110" y="162" fill="#FFFFFF">K</text>
    <!-- L -->
    <text x="235" y="162" fill="#FFFFFF">L</text>
    <!-- Y -->
    <text x="340" y="162" fill="#FFFFFF">Y</text>
    <!-- Accent Teal Line inside Y -->
    <rect x="420" y="86" width="16" height="74" rx="3" fill="url(#klynnTealAccent)" />
    <!-- N -->
    <text x="445" y="162" fill="#FFFFFF">N</text>
    <!-- N -->
    <text x="575" y="162" fill="#FFFFFF">N</text>
  </g>
</svg>
